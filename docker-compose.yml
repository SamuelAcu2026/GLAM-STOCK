# Postgres dedicado a Glam Stock.
# Se publica en el puerto 5433 del host porque el 5432 ya está ocupado por otro servicio.
# Los datos persisten en el volumen glam_pgdata aunque se reinicie el contenedor.
services:
  db:
    image: postgres:17-alpine
    container_name: glam-stock-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: glam
      POSTGRES_PASSWORD: glam
      POSTGRES_DB: glamstock
    ports:
      - "5433:5432"
    volumes:
      - glam_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glam -d glamstock"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  glam_pgdata:
